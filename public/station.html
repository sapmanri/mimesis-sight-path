<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>별리라됴</title>
<!-- 공유·파비콘·PWA 패키지 (Vase 08-12 밤) — 로고 정본은 design/make-logo.py, 손으로 안 그린다 -->
<link rel="icon" type="image/png" sizes="64x64" href="/brand/logo-byeolliradyo-dot-64.png">
<link rel="icon" type="image/png" sizes="128x128" href="/brand/logo-byeolliradyo-dot-128.png">
<link rel="apple-touch-icon" sizes="180x180" href="/brand/logo-byeolliradyo-180.png">
<link rel="manifest" href="/radio.webmanifest">
<meta name="theme-color" content="#08090b">
<!-- 홈 화면 앱의 상태바 — 이 두 줄이 없으면 시계 뒤가 흰색으로 남는다 (사장 실견 08-12 밤).
     black-translucent = 페이지가 상태바 밑까지 깔린다. 위쪽 안전영역 패딩은 body에서. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:type" content="website">
<meta property="og:title" content="별리라됴">
<meta property="og:description" content="별리(別里)에서 스물네 시간 — 오늘의 DJ는 별이. 놀고, 읽고, 가끔 조용한 방송">
<meta property="og:url" content="https://byeoli.sapmanri.com/station">
<meta property="og:image" content="https://byeoli.sapmanri.com/brand/og-byeolliradyo.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  /* 별리 라디오 — 어두운 방의 손라디오 한 대 + 누런 황록빛 옛 LCD 자막창
     (Vase 08-12: "옛날 손라디오… 자막은 누렇고 연한 녹색빛 옛 TFT LCD 느낌") */
  @font-face {
    font-family: 'NeoDGM';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/NeoDunggeunmoPro-Regular.woff2') format('woff2');
    font-display: swap;
  }
  :root { --ink:#d7dce6; --dim:#8a93a6; --accent:#ffd9a0;
          --body1:#2b2117; --body2:#1a140e; --bezel:#141009;
          --lcd1:#c6cf97; --lcd2:#aab465; --lcdink:#23260f; --lcdpast:#5c6238; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:radial-gradient(ellipse at 50% 30%, #101114, #08090b 70%); color:var(--ink);
         font-family:'Apple SD Gothic Neo',Pretendard,sans-serif;
         min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
         /* 아이폰 안전영역 — 아래는 사파리 바, 위는 홈 화면 앱의 상태바(시계) 자리 (Vase 08-12 밤) */
         padding:24px; padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
         padding-top:calc(24px + env(safe-area-inset-top, 0px)); }
  main { width:100%; max-width:540px; }
  /* 헤더는 간판만 맡는다. 사연·기록은 아래 라디오 프리셋 판으로 내려 몸체에 심는다. */
  .brand { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .brand img { width:44px; height:44px; border-radius:11px; flex:none; }
  .brand h1 { flex:1; min-width:0; }
  @media (max-height:760px) { .script { height:38vh; } }
  h1 { font-size:19px; font-weight:600; letter-spacing:-.2px; }
  .sub { color:var(--dim); font-size:12.5px; }
  .brandsub { margin-bottom:14px; line-height:1.65; }
  /* 손라디오의 프리셋 단추 세 개. 페이지 밖의 링크가 아니라 같은 기계의 기능처럼 보인다. */
  .stationNav { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:0;
                padding:8px 10px 9px; border:1px solid #3d3225; border-bottom-color:#211a12;
                border-radius:18px 18px 0 0;
                background:linear-gradient(175deg,var(--body1),#1b150f);
                box-shadow:0 10px 24px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,220,170,.07); }
  .stationNav a { position:relative; min-height:39px; display:flex; align-items:center; justify-content:center;
                  color:#82745e; text-decoration:none; font-size:12px; letter-spacing:.02em;
                  border:1px solid #332b21; border-radius:8px;
                  background:linear-gradient(180deg,#29231c,#191510);
                  box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 2px 3px rgba(0,0,0,.35); }
  .stationNav a::before { content:''; width:5px; height:5px; border-radius:50%; margin-right:7px;
                          background:#42392d; box-shadow:inset 0 1px 2px #090806; }
  .stationNav a.active { color:#eadbbf; border-color:#695740;
                         background:linear-gradient(180deg,#3a3024,#211a13); }
  .stationNav a.active::before { background:var(--accent); box-shadow:0 0 7px rgba(255,217,160,.65); }
  .stationNav a:active { transform:translateY(1px); box-shadow:inset 0 2px 4px rgba(0,0,0,.45); }
  /* 라디오 몸통 — 위에서 빛 받는 갈색 케이스 */
  .deck { background:linear-gradient(175deg, var(--body1), var(--body2) 80%);
          border:1px solid #3d3225; border-top:0; border-radius:0 0 20px 20px;
          padding:20px 20px 14px; box-shadow:0 18px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,220,170,.08); }
  .nowline { display:flex; align-items:center; gap:10px; min-height:24px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#4d4335; flex:none; }
  .dot.live { background:#e46; box-shadow:0 0 8px #e468; }
  .now { font-size:14.5px; line-height:1.6; color:#e8d9bd; }
  .state { color:#907f63; font-size:12px; margin-top:4px; min-height:18px; }
  .row { display:flex; align-items:center; gap:16px; margin-top:16px; }
  /* 재생 노브 */
  button.play { width:56px; height:56px; border-radius:50%; border:1px solid #61503a; cursor:pointer; flex:none;
                background:radial-gradient(circle at 35% 30%, #ffe9c4, var(--accent) 55%, #c79a5e);
                color:#241a0c; font-size:19px;
                box-shadow:0 4px 10px rgba(0,0,0,.5), inset 0 -3px 6px rgba(120,80,30,.45), inset 0 2px 3px rgba(255,255,255,.5); }
  button.play:active { transform:translateY(1px); }
  /* 주파수 다이얼 — 눈금판 위를 바늘이 달린다 */
  .tl { flex:1; }
  .dial { position:relative; height:48px; border-radius:10px; background:#15110c;
          border:1px solid #3a2f21; box-shadow:inset 0 2px 6px rgba(0,0,0,.6);
          background-image:
            repeating-linear-gradient(90deg, rgba(255,217,160,.28) 0 1px, transparent 1px 34px),
            repeating-linear-gradient(90deg, rgba(255,217,160,.12) 0 1px, transparent 1px 8.5px);
          background-size:100% 55%, 100% 32%; background-position:0 100%, 0 100%; background-repeat:no-repeat; }
  .dial::after { content:''; position:absolute; inset:5px 8px auto; height:1px;
                 background:linear-gradient(90deg,transparent,#6b573a,transparent); opacity:.55; }
  .dialMarks { position:absolute; inset:0 10px; pointer-events:none; overflow:hidden; }
  .dialMark { position:absolute; bottom:5px; width:2px; height:10px; border-radius:2px;
              background:#8b7655; opacity:.62; transform:translateX(-1px); }
  .dialMark.voice { height:15px; background:#c6cf97; opacity:.82; }
  .dial input[type=range] { -webkit-appearance:none; appearance:none; position:absolute; inset:-5px 0;
          width:100%; height:58px; background:transparent; margin:0; cursor:grab; touch-action:pan-y; }
  .dial input[type=range]:active { cursor:grabbing; }
  .dial input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:42px;
          border-radius:7px; border:1px solid #725f45;
          background:linear-gradient(90deg,#282016 0 8px,var(--accent) 8px 13px,#282016 13px 100%);
          box-shadow:0 2px 7px rgba(0,0,0,.75),0 0 9px rgba(255,217,160,.3),inset 0 1px rgba(255,255,255,.12); }
  .dial input[type=range]::-moz-range-thumb { width:22px; height:42px; border-radius:7px;
          border:1px solid #725f45;
          background:linear-gradient(90deg,#282016 0 8px,var(--accent) 8px 13px,#282016 13px 100%);
          box-shadow:0 2px 7px rgba(0,0,0,.75),0 0 9px rgba(255,217,160,.3); }
  .dial.magnetic { border-color:#7c6749; box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 0 10px rgba(255,217,160,.12); }
  .times { display:flex; align-items:center; justify-content:space-between; gap:8px; color:#8a795d;
           font-size:11px; margin-top:7px; min-height:28px; }
  .tunerReadout { flex:1; min-width:0; line-height:1.35; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tunerReadout.session { color:#c6cf97; }
  .liveBtn { background:none; border:1px solid #4d4133; color:#8a795d; border-radius:8px;
             padding:4px 10px; font-size:12px; cursor:pointer; }
  .liveBtn.on { color:var(--accent); border-color:var(--accent); }
  /* 스피커 그릴 */
  .grille { margin-top:16px; height:26px; border-radius:8px;
            background-image:radial-gradient(circle at 3px 3px, #0d0a06 1.6px, transparent 1.9px);
            background-size:9px 9px; background-position:center;
            border:1px solid #352b1e; box-shadow:inset 0 2px 5px rgba(0,0,0,.5); }
  .foot { margin-top:20px; font-size:12.5px; color:var(--dim); }
  .foot a { color:var(--accent); text-decoration:none; cursor:pointer; }
  /* 화면들 — 같은 방 안의 벽들. 어디로 가든 방송은 계속 흐른다 (Vase 08-12) */
  #view-letter, #view-archive { display:none; }
  main.letter #view-radio, main.archive #view-radio { display:none; }
  main.letter #view-letter { display:block; }
  main.archive #view-archive { display:block; }
  /* 지난 방송 */
  .archCard { background:linear-gradient(175deg, #1c1a22, #131218); border:1px solid #3d3225; border-top:0;
              border-radius:0 0 16px 16px; padding:8px 6px; }
  .archDayRow { display:flex; justify-content:space-between; align-items:center; width:100%;
                background:none; border:0; color:var(--ink); font:inherit; font-size:14.5px;
                padding:12px 14px; cursor:pointer; border-radius:10px; text-align:left; }
  .archDayRow:hover { background:#1e1c26; }
  .archDayRow .k { color:var(--dim); font-size:12px; }
  .archBack { color:var(--dim); font-size:12.5px; background:none; border:0; cursor:pointer; padding:10px 14px; }
  .archSeg { padding:11px 14px; border-top:1px solid #232030; }
  .archSeg .head { display:flex; align-items:center; gap:10px; }
  .archSeg .tm { color:var(--dim); font-size:11.5px; flex:none; width:38px; }
  .archSeg .kd { flex:none; font-size:11px; color:#0f0d14; background:var(--accent); border-radius:6px;
                 padding:1px 7px; opacity:.85; }
  .archSeg .tt { font-size:13.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .archSeg .rp { flex:none; background:none; border:1px solid #4d4133; color:var(--accent);
                 border-radius:8px; padding:3px 10px; font-size:12px; cursor:pointer; }
  .archSeg .full { display:none; color:var(--dim); font-size:13px; line-height:1.9; white-space:pre-wrap;
                   margin-top:10px; }
  .archSeg.open .full { display:block; }
  .archSeg.playing .tt { color:var(--accent); }
  #arch { width:100%; margin-top:12px; filter:invert(.9) hue-rotate(180deg); border-radius:8px; }
  .letterCard { background:linear-gradient(175deg, #1c1a22, #131218); border:1px solid #3d3225; border-top:0;
                border-radius:0 0 16px 16px; padding:22px 20px; }
  .letterCard textarea { width:100%; min-height:170px; resize:vertical; background:#0e0d13;
                color:var(--ink); border:1px solid #2e2b38; border-radius:12px;
                padding:14px 16px; font:inherit; font-size:14.5px; line-height:1.8; }
  .letterCard textarea:focus { outline:none; border-color:#4a4560; }
  .lrow { display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
  .count { color:var(--dim); font-size:12px; }
  .sendBtn { background:var(--accent); color:#201607; border:0; border-radius:10px;
             padding:10px 22px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
  .sendBtn:disabled { opacity:.45; cursor:default; }
  .lnote { color:var(--dim); font-size:12px; line-height:1.7; margin-top:16px; }
  .lmsg { margin-top:14px; font-size:14px; min-height:22px; }
  .lmsg.ok { color:var(--accent); } .lmsg.err { color:#e08a8a; }
  .hp { position:absolute; left:-9999px; }
  /* 옛 LCD 자막창 — 누런 황록 백라이트·픽셀 글씨. 말을 뒤따라 써진다 */
  .script { margin-top:16px; border-radius:14px; border:10px solid var(--bezel);
            outline:1px solid #3d3225;
            background-image:
              repeating-linear-gradient(0deg, rgba(60,66,30,.07) 0 1px, transparent 1px 3px),
              repeating-linear-gradient(90deg, rgba(60,66,30,.05) 0 1px, transparent 1px 3px),
              linear-gradient(160deg, var(--lcd1), var(--lcd2));
            box-shadow:inset 0 3px 14px rgba(50,55,20,.35), 0 0 26px rgba(190,200,130,.10);
            /* LCD는 고정 크기다 — 글자 따라 늘어나는 액정은 없다 (Vase 08-12 ㅋㅋ) */
            padding:18px 20px; height:48vh; overflow-y:auto;
            font-family:'NeoDGM', ui-monospace, Menlo, monospace;
            font-size:15px; line-height:1.9; letter-spacing:.02em; white-space:pre-wrap;
            color:var(--lcdink); text-shadow:0 0 1px rgba(35,38,15,.4); }
  .script .past { color:var(--lcdpast); display:block; margin:0 0 13px; }
  .script .typed { color:var(--lcdink); display:block; }
  .script .cursor { animation:blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .script .empty { color:#6b7245; font-size:13.5px; font-family:inherit; }
  @media (max-width:420px) {
    body { padding-left:15px; padding-right:15px; }
    .deck { padding-left:16px; padding-right:16px; }
    .row { gap:12px; }
    button.play { width:54px; height:54px; }
    .stationNav a { font-size:11.5px; }
  }
</style>
</head>
<body>
<main>
  <div class="brand">
    <img src="/brand/logo-byeolliradyo-192.png" alt="별리라됴">
    <h1>별리 라디오</h1>
  </div>
  <!-- 두 줄로 의도해서 자른다 — 화면 폭 따라 "방송" 두 글자만 떨어지는 고아 줄 금지 (사장 실견) -->
  <div class="sub brandsub">별리(別里)에서 스물네 시간 —<br>오늘의 DJ는 별이. 놀고, 읽고, 가끔 조용한 방송</div>
  <nav class="stationNav" aria-label="별리 라디오 프리셋">
    <a href="#radio" data-view="radio">방송</a>
    <a href="#letter" data-view="letter">사연</a>
    <a href="#archive" data-view="archive">지난 방송</a>
  </nav>

  <section id="view-radio">
    <div class="deck">
      <div class="nowline"><span class="dot" id="dot"></span><span class="now" id="now">…</span></div>
      <div class="state" id="state"></div>
      <div class="row">
        <button class="play" id="play">▶</button>
        <div class="tl">
          <div class="dial" id="dial"><div class="dialMarks" id="dialMarks"></div><input type="range" id="bar" min="0" max="100000" value="100000" aria-label="지난 방송 시간 맞추기"></div>
          <div class="times"><span class="tunerReadout" id="t0"></span><button class="liveBtn on" id="liveBtn">● 라이브</button></div>
        </div>
      </div>
      <div class="grille"></div>
    </div>

    <div class="script" id="script"><span class="empty">글자 방송 — 별이가 말하면 여기에도 흐릅니다.</span></div>

    <div class="foot">하루의 소리와 이야기가 천천히 지나가는 작은 방송국.</div>
  </section>

  <!-- 사연 남기기 — 같은 방의 다른 벽. 방송은 계속 흐른다 (페이지 이동 없음, Vase 08-12) -->
  <section id="view-letter">
    <div class="letterCard">
      <form id="f">
        <textarea id="t" maxlength="1000" placeholder="요즘의 이야기를 편하게 적어 주세요. (10자 이상)"></textarea>
        <input class="hp" type="text" id="hp" tabindex="-1" autocomplete="off">
        <div class="lrow">
          <span class="count" id="c">0 / 1000</span>
          <button class="sendBtn" id="b" type="submit">남기기</button>
        </div>
      </form>
      <div class="lmsg" id="m"></div>
      <div class="lnote">· 이름·연락처·링크 등 개인정보는 적지 말아 주세요 — 들어 있으면 접수되지 않아요.<br>
      · 남긴 사연은 별이의 목소리로 읽혀 방송될 수 있어요.</div>
    </div>
  </section>

  <!-- 지난 방송 — 날짜별 목록·내용·다시 듣기 (Vase 08-12) -->
  <section id="view-archive">
    <div class="archCard" id="archBox"><div class="archBack">불러오는 중…</div></div>
    <audio id="arch" controls preload="none" style="display:none"></audio>
  </section>

  <audio id="au" preload="auto"></audio>
  <audio id="amb" loop preload="auto"></audio>
</main>
<script>
/* 방송 시계 모델:
   - 편성표(segments)는 절대 시간축. 청취 위치 P(ms)가 그 축 위를 걷는다.
   - 라이브 = P가 (지금-2초)를 따라감. 당기면 과거의 P에서 걷는다.
   - P가 토막 안이면 그 파일을 오프셋 재생, 빈 구간이면 환경음, 라이브 앞 공백이면 HOLD. */
const $ = (id) => document.getElementById(id);
const au = $('au'), amb = $('amb');
amb.src = 'https://pub-8ec6440aae5545379fcfdd50a243847a.r2.dev/radio/ambient.m4a';
amb.volume = 0.35;
amb.loop = false;   // 루프 금지 — 끝나는 순간이 백그라운드에서도 살아 있는 유일한 심장박동이다

let segs = [], clockOffset = 0, playing = false, live = true, anchor = null; // anchor={P0, t0} 과거 재생 기준
let currentSeg = null;

/* ═══ Liquidsoap 연속 MP3 (08-13 구조 최종 교체) ═══
   HLS의 6초 조각·재생목록·배달·캐시 층을 걷어냈다. 라이브는 하나로 이어진 MP3 줄기를
   운영체제가 계속 받고, 과거 튜닝만 기존 영구 파일을 쓴다. */
const LIVE_URL = '/api/radio/stream';
const LIVE_LAT_MS = 3500;   // 32KB harbor burst + 터널 왕복. HLS의 18초 지연은 사라졌다.
const BAR_MAX = 100000;     // 48시간 눈금에서도 초 단위 목적지를 잡을 수 있는 해상도
let usingStream = false;
let streamRetryTimer = null, streamRetryDelay = 1500;
/* 지금 나가는 것 — 생성기의 진실(/api/radio/now). 라벨·[다시 듣기]·자막이 전부 여기서 나온다.
   재방송은 편성표에 없으므로 편성표 추측(segAt)으로는 화면이 거짓말을 하게 된다 (사장 08-13). */
let nowData = null, nowFetchedAt = 0;
async function fetchNow() {
  try {
    const r = await fetch('/api/radio/now', { cache: 'no-store' });
    nowData = await r.json();
  } catch {}
  nowFetchedAt = Date.now();
}
function streamStart() {
  if (streamRetryTimer) { clearTimeout(streamRetryTimer); streamRetryTimer = null; }
  usingStream = true; live = true; anchor = null; currentSeg = null;
  amb.pause();
  au.src = LIVE_URL + '?connect=' + Date.now();
  tryPlay(au);
  $('now').textContent = '별리의 방 — 방송 중';
}
function scheduleStreamRetry() {
  if (streamRetryTimer || !playing || !live) return;
  const delay = streamRetryDelay;
  streamRetryDelay = Math.min(15000, Math.round(streamRetryDelay * 1.7));
  streamRetryTimer = setTimeout(() => {
    streamRetryTimer = null;
    if (playing && live) streamStart();
  }, delay);
}

/* 무조건 나온다 (사장 08-12 밤: "라디오면 그냥 라디온 거야") — 사람 손을 부르는 안내는 금지.
   대신 되살아나는 길을 전부 깐다: ① 전멸 감시(0.5초마다 — tick 안) ② 멈춤 이벤트 즉시 재시도
   (인터럽션 직후가 재생 허가가 살아 있는 순간이다) ③ 화면 복귀 순간 라이브 재접속
   ④ 시스템 미디어 자리 등록(잠금화면·이어폰 버튼이 우리 플레이어를 조작). 거부는 콘솔에만. */
function tryPlay(el) {
  el.play().catch((e) => {
    if (!tryPlay.warned) { tryPlay.warned = true; console.warn('재생 거부:', e && e.name); }
  });
}
au.addEventListener('playing', () => {
  amb.pause();
  if (usingStream) streamRetryDelay = 1500;
}); // 목소리가 나오면 방 소리는 쉰다
au.addEventListener('error', () => {
  // 원점이 잠깐 죽어도 과거 파일 붙이기 엔진으로 되돌아가지 않는다. 방 소리를 깔고
  // 하나의 연속 줄기에 지수 백오프로 다시 붙는다. Tunnel 주소 변경도 여기서 회복한다.
  if (usingStream) {
    usingStream = false;
    au.removeAttribute('src');
    if (playing && live) { amb.currentTime = 0; tryPlay(amb); scheduleStreamRetry(); }
  }
});
// 예상 밖 멈춤은 그 자리에서 되살린다 — 의도한 멈춤(사용자 정지·간극 전환)은 걸러진다
au.addEventListener('pause', () => {
  if (!playing || au.ended) return;
  if (usingStream || currentSeg !== null) tryPlay(au);
});
amb.addEventListener('pause', () => {
  if (!playing || usingStream) return;
  setTimeout(() => { if (playing && !usingStream && au.paused && amb.paused) tryPlay(amb); }, 150);
});
document.addEventListener('pointerdown', () => {   // 손이 오면 그 김에 — 요구하진 않는다
  if (!playing) return;
  if (usingStream) { if (au.paused) streamStart(); }
  else if (au.paused && amb.paused) liveAdvance();
});
document.addEventListener('visibilitychange', () => {  // 화면으로 돌아온 순간 = 라이브로 재접속
  if (document.hidden || !playing) return;
  if (usingStream) { if (au.paused) streamStart(); }
  else liveAdvance();
});
if ('mediaSession' in navigator) {
  navigator.mediaSession.metadata = new MediaMetadata({ title: '별리 라디오', artist: '별이' });
  navigator.mediaSession.setActionHandler('play', () => { if (!playing) $('play').click(); else liveAdvance(); });
  navigator.mediaSession.setActionHandler('pause', () => { if (playing) $('play').click(); });
}

async function loadProgram() {
  try {
    const r = await fetch('/api/radio/program', { cache: 'no-store' });
    const d = await r.json();
    if (!d.ok) return;
    segs = d.segments || [];
    clockOffset = d.now - Date.now();
    renderDialMarks();
  } catch {}
}
const serverNow = () => Date.now() + clockOffset;
const liveP = () => serverNow() - 2000;
const P = () => live ? liveP() : (anchor ? anchor.P0 + (Date.now() - anchor.t0) : liveP());
const spanStart = () => segs.length ? segs[0].startAt : liveP();
const segAt = (p) => segs.find((s) => p >= s.startAt && p < s.startAt + s.dur * 1000);

function fmt(ms) {
  const d = new Date(ms + 9 * 3600000);
  return d.toISOString().slice(11, 16);
}
function fmtSeconds(ms) {
  const d = new Date(ms + 9 * 3600000);
  return d.toISOString().slice(11, 19);
}
function tunerKind(kind) {
  return ({ talk:'이야기', story:'사연', song:'노래', ambient:'쉼' })[kind] || '방송';
}
function setTunerReadout(p, moving=false) {
  const el = $('t0');
  const session = segAt(p);
  el.classList.toggle('session', !!session);
  if (session) {
    el.textContent = `${tunerKind(session.kind)} · ${session.title}${moving ? ' — 여기로 맞추기' : ''}`;
  } else {
    el.textContent = `${fmtSeconds(p)} KST${moving ? ' — 손을 떼면 이동' : ''}`;
  }
}
function renderDialMarks() {
  const box = $('dialMarks');
  if (!box) return;
  const a = spanStart(), b = Math.max(liveP(), a + 60000);
  box.innerHTML = '';
  segs.slice(-300).forEach((session) => {
    const ratio = (session.startAt - a) / (b - a);
    if (ratio < 0 || ratio > 1) return;
    const mark = document.createElement('i');
    mark.className = 'dialMark' + (session.kind === 'talk' || session.kind === 'story' ? ' voice' : '');
    mark.style.left = (ratio * 100) + '%';
    box.appendChild(mark);
  });
}

/* 토막 붙이기 — 한 자리에서만 한다. ⚠ 늦참 정책 (사장 08-12 밤 "앞에 꺼 다 씹어먹고
   마지막 세 줄만"): 잠금화면에선 심장박동이 배경음 끝(최대 90초 간격)에만 뛰어 토막
   중간에 붙게 된다. 말은 무조건 처음부터 — 3초 넘게 늦었으면 토막 시작으로 닻을 내리고,
   밀린 시간은 아래 간극 건너뛰기가 따라잡는다. */
function attachSeg(s, p) {
  currentSeg = s.id;
  au.src = s.url;
  const late = (p - s.startAt) / 1000;
  if (live && late > 3) {
    live = false; anchor = { P0: s.startAt, t0: Date.now() };
    au.currentTime = 0;
  } else {
    au.currentTime = Math.max(0, late);
  }
  tryPlay(au);
  $('now').textContent = s.title;
}

function tick() {
  if (usingStream) {
    // 연속 MP3 라이브 — 붙이기는 운영체제 몫. 여기선 소생·타임라인·화면 진실만.
    if (playing && au.paused) tryPlay(au);
    if (playing && Date.now() - nowFetchedAt > 6000) fetchNow();
    const a = spanStart(), b = Math.max(liveP(), a + 60000);
    const p = liveP() - LIVE_LAT_MS;
    if (!scrubbing && document.activeElement !== $('bar')) $('bar').value = Math.round(BAR_MAX * (p - a) / (b - a));
    if (!scrubbing) setTunerReadout(p);
    const nd = nowData;
    // 라이브 알약의 정직 (사장 00:35 "계속 라이브라고 되있는 건 내 핸폰이 삐꾸냐"):
    // 재방송이 나가는 동안은 「재방송」— 방송 줄기는 라이브지만 내용은 다시 듣기다.
    const replaying = !!(nd && nd.isReplay && nd.kind !== 'bed');
    $('liveBtn').textContent = replaying ? '● 재방송' : '● 라이브';
    $('liveBtn').classList.toggle('on', !replaying);
    $('dot').classList.toggle('live', playing);
    if (nd && nd.kind !== 'bed' && nd.startedAt) {
      $('now').textContent = nd.title || '별리의 방';
      $('state').textContent = nd.isReplay
        ? (nd.kind === 'song' ? '노래 다시 듣기 — ' + (nd.title || '') : '지난 방송 다시 듣기')
        : nd.kind === 'story' ? '사연을 읽는 중'
        : nd.kind === 'song' ? '노래 — ' + (nd.title || '')
        : nd.voiceNote ? '목소리 — ' + nd.voiceNote : '';
      const elapsed = serverNow() - nd.startedAt - LIVE_LAT_MS;
      const cur = nd.script ? { id: 'now:' + nd.startedAt, script: nd.script,
        startAt: nd.startedAt + LIVE_LAT_MS, dur: nd.dur || 1 } : null;
      renderScript(cur, cur ? Math.max(0, elapsed / ((nd.dur || 1) * 1000)) : 0);
    } else {
      $('now').textContent = '별리의 방 — 방송 중';
      $('state').textContent = '';
      renderScript(null, 0);
    }
    return;
  }
  if (!live && anchor) {
    const pNow = P();
    if (pNow >= liveP() - 500) { live = true; anchor = null; }   // 따라잡음 — 라이브 복귀
    else if (playing && !segAt(pNow)) {
      // 간극은 밀린 시간부터 삼킨다 — 다음 토막 직전(또는 라이브)까지 건너뛰어 따라잡는다.
      // 과거 당겨 듣기에도 적용된다: 다시 듣기에 빈 공기는 필요 없다.
      const nxt = segs.filter((x) => x.startAt > pNow).sort((a, b) => a.startAt - b.startAt)[0];
      const target = Math.min(liveP(), nxt ? nxt.startAt - 2000 : liveP());
      if (target > pNow + 1000) anchor = { P0: target, t0: Date.now() };
    }
  }
  const p = P();
  // 타임라인
  const a = spanStart(), b = Math.max(liveP(), a + 60000);
  if (!scrubbing && document.activeElement !== $('bar')) $('bar').value = Math.round(BAR_MAX * (p - a) / (b - a));
  if (!scrubbing) setTunerReadout(p);
  $('liveBtn').textContent = '● 라이브';
  $('liveBtn').classList.toggle('on', live);
  $('dot').classList.toggle('live', live && playing);

  if (!playing) { renderScript(segAt(p), 0); return; }
  // 전멸 감시 (08-12 밤 "또 그냥 멈췄어"): 틀어놨는데 아무 소리도 없는 상태를 허용하지 않는다 —
  // 소리가 있어야 심장박동이 뛴다. 뭐라도(방 소리) 즉시 살린다. 목소리가 붙으면 알아서 쉰다.
  if (au.paused && amb.paused) tryPlay(amb);
  // 꼬리 은혜 (08-12 밤 "말 끝단이 끊겨"): 벽시계가 토막 끝을 지나도 소리가 아직 말하는 중이면
  // 2.5초까지 기다린다 — 로딩 지연만큼 뒤로 밀린 끝맺음을 자르지 않는다.
  if (currentSeg !== null && !au.ended && !au.paused) {
    const cur = segs.find((x) => x.id === currentSeg);
    if (cur && P() > cur.startAt + cur.dur * 1000 && P() - (cur.startAt + cur.dur * 1000) < 2500) return;
  }
  const s = segAt(p);
  renderScript(s, s ? (p - s.startAt) / (s.dur * 1000) : 0);
  if (s) {
    if (currentSeg !== s.id) {
      currentSeg = s.id;
      au.src = s.url;
      au.currentTime = Math.max(0, (p - s.startAt) / 1000);
      tryPlay(au);
      $('now').textContent = s.title;
      $('state').textContent = s.kind === 'story' ? '사연을 읽는 중'
        : s.kind === 'song' ? '노래 — ' + (s.title || '') : s.voiceNote ? '목소리 — ' + s.voiceNote : '';
      au.onerror = () => setTimeout(() => { if (currentSeg === s.id) { au.load(); tryPlay(au); } }, 1200);
    } else {
      // 거부 회복 (08-12 밤 교착의 두 번째 축): "이미 트는 중" 도장 때문에 재시도가 없었다 —
      // 같은 토막인데 소리가 잠들어 있으면 다시 깨운다 (ended는 제외 — 처음부터 다시 틀게 된다).
      if (au.paused && !au.ended) tryPlay(au);
      // 표류 보정 — 방송 시계와 파일 재생이 1.5초 이상 어긋나면 맞춘다
      const want = (p - s.startAt) / 1000;
      if (Math.abs(au.currentTime - want) > 1.5) au.currentTime = want;
    }
  } else {
    if (currentSeg !== null) { currentSeg = null; au.pause(); }
    if (amb.paused) tryPlay(amb);
    // 안내·카운트다운 없음 (Vase 08-12: "마이크 앞에 별이가 없을 뿐, 별이는 저기 살고 있는").
    // 대신 방 이름표는 걸어둔다 — 라이브 대기 중 위가 비면 이상하다 (사장 08-12 밤).
    $('now').textContent = '별리의 방 — 방송 중';
    $('state').textContent = '';
  }
}

/* 글자 방송 — 말을 뒤따라 한 글자씩 써진다. 지난 토막은 기록으로 쌓인다 (라이브 감). */
let lastRender = '';
function renderScript(cur, frac) {
  const el = $('script');
  const p = P();
  // 지난 토막들 (대본 있는 것만, 최근 6개) — 이미 말해진 기록
  const past = segs.filter((x) => x.script && x.startAt + x.dur * 1000 <= p && (!cur || x.id !== cur.id)).slice(-6);
  let html = past.map((x) => `<span class="past"></span>`).join('');
  let typedText = null;
  if (cur && cur.script) {
    const upto = Math.max(0, Math.floor(cur.script.length * Math.min(1, frac)));
    typedText = cur.script.slice(0, upto);
    html += `<span class="typed"></span>`;
  }
  if (!html) {
    if (lastRender !== 'empty') { lastRender = 'empty'; el.innerHTML = '<span class="empty">글자 방송 — 별이가 말하면 여기에 뒤따라 써집니다.</span>'; }
    return;
  }
  const key = past.map((x) => x.id).join(',') + '|' + (typedText ? typedText.length : -1);
  if (key === lastRender) return;
  lastRender = key;
  el.innerHTML = html;
  const spans = el.querySelectorAll('.past');
  past.forEach((x, i) => { spans[i].textContent = x.script; });
  if (typedText !== null) {
    const t = el.querySelector('.typed');
    t.textContent = typedText;
    const c = document.createElement('span'); c.className = 'cursor'; c.textContent = '▌';
    t.appendChild(c);
  }
  el.scrollTop = el.scrollHeight;
}

/* 라이브 심장박동 — 소리가 끝날 때마다(백그라운드에서도 발화) 편성표를 새로 읽고 다음을 정한다.
   ⚠ 순서가 생명이다 (08-12 밤 "또 그냥 멈췄어" 교착의 첫 축): 예전엔 네트워크를 기다린 **뒤**
   play()를 불렀다 — 이벤트 문맥을 벗어나면 아이폰이 재생 허가를 거둬가고, 그 한 번의 거부로
   모든 소리가 죽어 심장박동 자체가 멎었다. 이제 이벤트 문맥 **안에서** 방 소리부터 즉시 살리고
   (소리가 살아 있으면 세션이 유지돼 뒤의 play()도 허락된다), 그다음에 편성표를 읽는다. */
async function liveAdvance() {
  if (!playing || usingStream) return;   // 연속 스트림 중엔 붙이기·방 소리 전부 Liquidsoap 몫
  if ((au.paused || au.ended) && amb.paused) { amb.currentTime = 0; tryPlay(amb); }
  if (!live) return;
  await loadProgram();
  const p = liveP();
  const sNow = segAt(p);
  if (sNow && currentSeg !== sNow.id) {
    currentSeg = sNow.id;
    au.src = sNow.url;
    au.currentTime = Math.max(0, (p - sNow.startAt) / 1000);
    tryPlay(au);
    $('now').textContent = sNow.title;
  } else if (currentSeg === null || au.ended || au.paused) {
    currentSeg = null;
    if (amb.paused) { amb.currentTime = 0; tryPlay(amb); }
  }
}
amb.onended = liveAdvance;
au.addEventListener('ended', liveAdvance);

$('play').onclick = () => {
  playing = !playing;
  $('play').textContent = playing ? '❚❚' : '▶';
  if (playing) {
    if (live) streamStart();             // 라이브는 연속 MP3 — 잠가도 나온다
  } else {
    usingStream = false;
    if (streamRetryTimer) { clearTimeout(streamRetryTimer); streamRetryTimer = null; }
    au.pause(); au.removeAttribute('src'); amb.pause(); currentSeg = null; $('state').textContent = '';
    checkVersion();   // 멈춘 김에 — 새 판이 나와 있으면 이 참에 갈아입는다
  }
};
/* 세션 튜너: 10만 눈금으로 손가락 정밀도를 확보하고, 방송 시작점 가까이 가면 가볍게
   자석처럼 붙는다. 세션 안에서는 분초 대신 실제 방송 제목을 보여준다. */
let scrubbing = false;
let magnetKey = '';
const barP = () => {
  const a = spanStart(), b = Math.max(liveP(), a + 60000);
  return { a, b, p: a + (b - a) * (Number($('bar').value) / BAR_MAX) };
};
function magnetize(a, b, rawP) {
  const threshold = Math.min(30000, Math.max(8000, (b - a) * 0.008));
  let nearest = null, distance = Infinity;
  for (const session of segs) {
    const d = Math.abs(session.startAt - rawP);
    if (d < distance) { nearest = session; distance = d; }
  }
  if (nearest && distance <= threshold) {
    $('bar').value = Math.round(BAR_MAX * (nearest.startAt - a) / (b - a));
    $('dial').classList.add('magnetic');
    if (magnetKey !== nearest.id) {
      magnetKey = nearest.id;
      if (navigator.vibrate) navigator.vibrate(8);
    }
    return nearest.startAt;
  }
  magnetKey = '';
  $('dial').classList.remove('magnetic');
  return rawP;
}
$('bar').oninput = () => {
  scrubbing = true;
  const { a, b, p: rawP } = barP();
  const p = magnetize(a, b, rawP);
  if (b - p < 4000) {
    $('t0').classList.remove('session');
    $('t0').textContent = '라이브에 맞추기';
  } else setTunerReadout(p, true);
};
$('bar').onchange = () => {
  scrubbing = false;
  const { b, p } = barP();
  $('dial').classList.remove('magnetic');
  magnetKey = '';
  if (b - p < 4000) {
    if (playing) { streamStart(); return; }
    live = true; anchor = null;
  } else {
    // 과거 당겨 듣기 — 파일 플레이어로 내려온다 (화면 보며 쓰는 기능이라 얼 일이 없다)
    usingStream = false; if (playing) { au.pause(); au.removeAttribute('src'); }
    live = false; anchor = { P0: p, t0: Date.now() };
  }
  currentSeg = null; // 다음 tick이 새 위치로 붙는다
};
$('liveBtn').onclick = () => {
  if (playing) { streamStart(); return; }
  live = true; anchor = null; currentSeg = null;
};

/* 화면 오가기 — 방송(오디오 요소)은 그대로 산다. 해시로 오가니 뒤로가기도 먹는다. */
function applyView() {
  const m = document.querySelector('main');
  m.classList.toggle('letter', location.hash === '#letter');
  m.classList.toggle('archive', location.hash === '#archive');
  const view = location.hash === '#letter' ? 'letter' : location.hash === '#archive' ? 'archive' : 'radio';
  document.querySelectorAll('.stationNav a').forEach((link) => link.classList.toggle('active', link.dataset.view === view));
  if (location.hash === '#archive') loadArchive();
}
window.addEventListener('hashchange', applyView);

/* 지난 방송 — 날짜 목록 → 그날 내용 → 다시 듣기 (라이브와 스피커를 나눠 쓴다: 하나 켜면 하나 쉼) */
const KIND_KO = { talk: '이야기', story: '사연', song: '노래', ambient: '쉼' };
const arch = $('arch');
function hhmm(ms) { return new Date(ms + 9 * 3600000).toISOString().slice(11, 16); }
async function loadArchive() {
  const box = $('archBox');
  try {
    const d = await (await fetch('/api/radio/archive', { cache: 'no-store' })).json();
    if (!d.ok || !d.days.length) { box.innerHTML = '<div class="archBack">아직 지난 방송이 없어요.</div>'; return; }
    box.innerHTML = '';
    d.days.forEach((row) => {
      const btn = document.createElement('button');
      btn.className = 'archDayRow';
      const parts = [];
      if (row.kinds.talk) parts.push('이야기 ' + row.kinds.talk);
      if (row.kinds.story) parts.push('사연 ' + row.kinds.story);
      if (row.kinds.song) parts.push('노래 ' + row.kinds.song);
      btn.innerHTML = `<span>${row.day}</span><span class="k">${parts.join(' · ') || row.count + '편'}</span>`;
      btn.onclick = () => loadArchDay(row.day);
      box.appendChild(btn);
    });
  } catch { box.innerHTML = '<div class="archBack">지금은 못 불러왔어요 — 잠시 후 다시.</div>'; }
}
/* 그날 방송은 하나의 흐름 — 다시 듣기도 하나 (Vase 08-12: "부분별이 아니고 전체 다시 듣기").
   목록은 뭐가 있었는지만 보여주고, 버튼 하나로 그날 편들을 이어서 튼다. */
let dayQueue = [], dayIdx = -1;
function stopDayReplay() {
  arch.pause(); arch.onended = null; arch.style.display = 'none';
  dayQueue = []; dayIdx = -1;
  document.querySelectorAll('.archSeg').forEach((x) => x.classList.remove('playing'));
  const btn = $('dayPlay'); if (btn) btn.textContent = '▶ 그날 방송 다시 듣기';
}
function playDayIdx(i) {
  const box = $('archBox');
  if (i >= dayQueue.length) { stopDayReplay(); return; }
  dayIdx = i;
  box.querySelectorAll('.archSeg').forEach((x, xi) => x.classList.toggle('playing', xi === i));
  arch.style.display = 'block';
  arch.src = dayQueue[i].url;
  // 토막 사이 6초 — 「우리는 오늘도 느리게 시작합니다」가 잣대다 (사장 08-12 밤:
  // "1초도 안 띄우면 말하다가 죽어. 최소 5초 이상". 시간 값의 기본은 사람의 숨이다.)
  arch.onended = () => setTimeout(() => playDayIdx(i + 1), 6000);
  arch.play().catch(() => {});
}
async function loadArchDay(day) {
  const box = $('archBox');
  stopDayReplay();
  const d = await (await fetch('/api/radio/archive?day=' + day, { cache: 'no-store' })).json();
  box.innerHTML = '';
  const back = document.createElement('button');
  back.className = 'archBack'; back.textContent = '← ' + day + ' — 날짜 목록으로';
  back.onclick = () => { stopDayReplay(); loadArchive(); };
  box.appendChild(back);
  const segsDay = d.segments || [];
  const playBtn = document.createElement('button');
  playBtn.className = 'rp'; playBtn.id = 'dayPlay';
  playBtn.style.cssText = 'margin:2px 14px 10px; padding:7px 16px; font-size:13px;';
  playBtn.textContent = '▶ 그날 방송 다시 듣기';
  playBtn.onclick = () => {
    if (dayIdx >= 0) { stopDayReplay(); return; }
    if (playing) $('play').click();               // 라이브 쉬고 (스피커는 하나다)
    dayQueue = segsDay;
    playBtn.textContent = '■ 멈추기';
    playDayIdx(0);
  };
  box.appendChild(playBtn);
  segsDay.forEach((s) => {
    const div = document.createElement('div');
    div.className = 'archSeg';
    div.innerHTML = `<div class="head"><span class="tm">${hhmm(s.startAt)}</span>` +
      `<span class="kd">${KIND_KO[s.kind] || s.kind}</span><span class="tt"></span></div><div class="full"></div>`;
    div.querySelector('.tt').textContent = s.title;
    div.querySelector('.full').textContent = s.script || '(대본 없음)';
    div.querySelector('.tt').onclick = () => div.classList.toggle('open');
    box.appendChild(div);
  });
}

applyView();

/* 사연 남기기 — 같은 화면 안에서 접수 (radio.html에서 옮겨옴) */
const t = $('t'), c = $('c'), b = $('b'), m = $('m');
t.addEventListener('input', () => { c.textContent = t.value.length + ' / 1000'; });
const REASON = {
  too_short: '조금만 더 적어 주세요. (10자 이상)', too_long: '너무 길어요. 1000자 안으로 줄여 주세요.',
  url: '링크는 넣을 수 없어요.', email: '이메일 주소는 넣을 수 없어요.', phone: '전화번호는 넣을 수 없어요.',
  repeat_spam: '같은 글자가 너무 반복돼요.', slow_down: '조금 있다가 다시 남겨 주세요.',
};
$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  b.disabled = true; m.className = 'lmsg'; m.textContent = '';
  try {
    const res = await fetch('/api/radio/story', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text: t.value, hp: $('hp').value }),
    });
    const out = await res.json().catch(() => ({}));
    if (res.ok && out.ok) {
      m.className = 'lmsg ok'; m.textContent = '남겨졌어요. 별이가 읽을 거예요.';
      t.value = ''; c.textContent = '0 / 1000';
    } else {
      m.className = 'lmsg err'; m.textContent = REASON[out.error] || '지금은 남길 수 없어요. 잠시 후에 다시 해주세요.';
    }
  } catch {
    m.className = 'lmsg err'; m.textContent = '연결이 잠깐 끊겼어요. 다시 한 번 눌러 주세요.';
  } finally { b.disabled = false; }
});

const pre = new Audio(); pre.preload = 'auto';
setInterval(() => {   // 30초 안에 올 다음 토막을 미리 받아둔다
  const p = P();
  const nxt = segs.find((x) => x.startAt > p && x.startAt - p < 30000);
  if (nxt && pre.src !== nxt.url) pre.src = nxt.url;
}, 5000);

/* 배포 자동 갈아입기 (사장 08-12 밤 "바로바로 해") — 옛 탭이 옛 버그를 무는 문제의 종결.
   페이지 지문(ETag)을 1분마다 보고 새 판이 나왔으면 스스로 새로고침한다.
   단 재생 중엔 절대 안 갈아입는다 — 방송을 끊는 새로고침은 라디오가 아니다.
   멈추는 순간 1분 안에 갈아입는다. 지문이 콜로마다 잠깐 다를 수 있어 시간당 1회 상한. */
let pageTag = null, reloadPending = false;
async function checkVersion() {
  try {
    // 지문 = 본문 해시 — CF Pages는 이 HTML에 ETag를 안 준다 (08-12 실측, HEAD·GET 다 없음).
    // 헤더에 기대면 감시가 조용히 무력화된다. 1분에 30KB 받는 값이면 공짜다.
    const r = await fetch(location.pathname, { cache: 'no-store' });
    const text = await r.text();
    let h = 0;
    for (let i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) | 0;
    const t = text.length + ':' + h;
    if (pageTag === null) { pageTag = t; return; }
    if (t !== pageTag) reloadPending = true;
    if (reloadPending && !playing) {
      const last = Number(sessionStorage.getItem('reloadedAt') || 0);
      if (Date.now() - last > 3600000) {
        sessionStorage.setItem('reloadedAt', String(Date.now()));
        location.reload();
      }
    }
  } catch {}
}
setInterval(checkVersion, 60000);
checkVersion();

loadProgram();
setInterval(loadProgram, 60000);
setInterval(tick, 500);
</script>
